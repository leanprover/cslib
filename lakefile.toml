name = "cslib"
version = "0.1.0"
defaultTargets = ["Cslib"]
testDriver = "runTests"
lintDriver = "batteries/runLinter"

[leanOptions]
weak.linter.mathlibStandardSet = true
weak.linter.flexible = true
# The next three linters are provided by Mathlib, but don't work here.
# This should be fixed, see discussion at https://leanprover.zulipchat.com/#narrow/channel/113488-general/topic/weak.2Elinter.2EmathlibStandardSet.20and.20lint-style-action/with/544726745
weak.linter.pythonStyle = false
weak.linter.checkInitImports = false
weak.linter.allScriptsDocumented = false

[[require]]
name = "Strata"
git = "https://github.com/strata-org/Strata"
rev = "e912c9bba0ad82244185e9c75b9535a6aedbd0f3"

[[require]]
name = "Strata-Boole"
git = "https://github.com/strata-org/Strata-Boole"
rev = "897964f1397eaee070ba0e867216a749dbfcbc42"

[[require]]
name = "StrataDDM"
git = "https://github.com/strata-org/Strata-DDM"
rev = "55307b6705f6286d6ad04e326fb3a28f297f1712"

[[require]]
name = "smt"
git = "https://github.com/ufmg-smite/lean-smt"
rev = "7d1d8239e78daa5197f9a71948776c4627049f5f"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

[[lean_lib]]
name = "Cslib"
globs = ["Cslib.*"]

[[lean_lib]]
name = "CslibTests"
globs = ["CslibTests.+"]

[[lean_exe]]
name = "checkInitImports"
srcDir = "scripts"
root = "CheckInitImports"

[[lean_exe]]
name = "runTests"
srcDir = "scripts"
root = "RunTests"
