version: 2
updates:
  # Grouped by semver impact so major bumps arrive on their own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: ci

  # Python packages installed by workflows (see requirements.txt here), split the same way.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-major:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: ci
