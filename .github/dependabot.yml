version: 2
updates:
  # Keep action pins fresh. Grouped by semver impact: routine bumps land together
  # in a single low-risk weekly PR, while breaking bumps arrive on their own so
  # each gets a dedicated review and CI run.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: ci
