name: Post to zulip if the nightly-testing branch is failing.

on:
  workflow_run:
    workflows: ["Lean Action CI"]
    types:
      - completed

jobs:
  handle_failure:

    if: ${{ github.repository == 'leanprover/cslib' &&
            github.event.workflow_run.conclusion == 'failure' &&
            github.event.workflow_run.head_branch == 'nightly-testing' }}
    runs-on: ubuntu-latest

    steps:
    - name: Send message on Zulip
      uses: zulip/github-actions-zulip/send-message@e4c8f27c732ba9bd98ac6be0583096dea82feea5 # v1.0.2
      with:
        api-key: ${{ secrets.ZULIP_API_KEY }}
        email: 'github-mathlib4-bot@leanprover.zulipchat.com'
        organization-url: 'https://leanprover.zulipchat.com'
        to: 'nightly-testing-cslib'
        type: 'stream'
        topic: 'Cslib status updates'
        content: |
          ❌ The latest CI for Cslib's [nightly-testing branch](https://github.com/leanprover/cslib/tree/nightly-testing) has [failed](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}) ([${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})).
          You can `git fetch; git checkout nightly-testing` and push a fix.

  handle_success:
    if: ${{ github.repository == 'leanprover/cslib' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'nightly-testing' }}
    runs-on: ubuntu-latest

    steps:
    - name: Generate app token
      id: app-token
      uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
      with:
        app-id: ${{ secrets.MATHLIB_NIGHTLY_TESTING_APP_ID }}
        private-key: ${{ secrets.MATHLIB_NIGHTLY_TESTING_PRIVATE_KEY }}
    # The create-github-app-token README states that this token is masked and will not be logged accidentally.

    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: nightly-testing # checkout nightly-testing branch
        fetch-depth: 0 # checkout all branches so that we can push from `nightly-testing` to `nightly-testing-YYYY-MM-DD`
        token: ${{ steps.app-token.outputs.token }}
    - name: Update the nightly-testing-YYYY-MM-DD branch
      run: |
        toolchain="$(<lean-toolchain)"
        if [[ $toolchain =~ leanprover/lean4:nightly-([a-zA-Z0-9_-]+) ]]; then
          version=${BASH_REMATCH[1]}
          printf 'NIGHTLY=%s\n' "${version}" >> "${GITHUB_ENV}"
          # Check if the remote tag exists
          if git ls-remote --tags --exit-code origin "nightly-testing-$version" >/dev/null; then
              printf 'Tag nightly-testing-%s already exists on the remote.' "${version}"
          else
              # If the tag does not exist, create and push the tag to remote
              printf 'Creating tag %s from the current state of the nightly-testing branch.' "nightly-testing-${version}"
              git tag "nightly-testing-${version}"
              git push origin "nightly-testing-${version}"
              # For now, these next two lines are commented out, but if later we want to set up benchmarking at the Speed server that can be restored.
              #   hash="$(git rev-parse "nightly-testing-${version}")"
              #   curl -X POST "https://speed.lean-lang.org/cslib/api/queue/commit/e7b27246-a3e6-496a-b552-ff4b45c7236e/$hash" -u "admin:${{ secrets.SPEED }}"
          fi
          hash="$(git rev-parse "nightly-testing-${version}")"
          printf 'SHA=%s\n' "${hash}" >> "${GITHUB_ENV}"
        else
          echo "Error: The file lean-toolchain does not contain the expected pattern."
          exit 1
        fi

    # If later we set up integrated testing so every Lean PR is tested against Cslib,
    # we will need to copy over some functionality from Mathlib's `nightly_detect_failure.yml` job.

    # Now post a success message to zulip, if the last message there is not a success message.
    # https://chat.openai.com/share/87656d2c-c804-4583-91aa-426d4f1537b3
    - name: Install Zulip API client
      run: pip install zulip

    - name: Check last message and post if necessary
      env:
        ZULIP_EMAIL: 'github-mathlib4-bot@leanprover.zulipchat.com'
        ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
        ZULIP_SITE: 'https://leanprover.zulipchat.com'
        SHA: ${{ env.SHA }}
      run: |
        import os
        import zulip
        client = zulip.Client(email=os.getenv('ZULIP_EMAIL'), api_key=os.getenv('ZULIP_API_KEY'), site=os.getenv('ZULIP_SITE'))

        # Get the last message from the bot in the 'status updates' topic.
        # We narrow by sender to ignore human replies in between.
        bot_email = 'github-mathlib4-bot@leanprover.zulipchat.com'
        request = {
          'anchor': 'newest',
          'num_before': 1,
          'num_after': 0,
          'narrow': [
            {'operator': 'stream', 'operand': 'nightly-testing-cslib'},
            {'operator': 'topic', 'operand': 'Cslib status updates'},
            {'operator': 'sender', 'operand': bot_email}
          ],
          'apply_markdown': False    # Otherwise the content test below fails.
        }
        response = client.get_messages(request)
        messages = response['messages']
        if not messages or messages[0]['content'] != f"✅ The latest CI for Cslib's [nightly-testing branch](https://github.com/leanprover/cslib/tree/nightly-testing) has succeeded! ([{os.getenv('SHA')}](https://github.com/${{ github.repository }}/commit/{os.getenv('SHA')}))":
            # Post the success message
            request = {
                'type': 'stream',
                'to': 'nightly-testing-cslib',
                'topic': 'Cslib status updates',
                'content': f"✅ The latest CI for Cslib's [nightly-testing branch](https://github.com/leanprover/cslib/tree/nightly-testing) has succeeded! ([{os.getenv('SHA')}](https://github.com/${{ github.repository }}/commit/{os.getenv('SHA')}))"
            }
            result = client.send_message(request)
            print(result)
      shell: python

    # Next, determine if we should remind the humans to create a new PR to the `bump/v4.X.0` branch.

    - name: Check for matching bump/nightly-YYYY-MM-DD branch
      id: check_branch
      run: |
        branch="bump/nightly-${NIGHTLY}"
        if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
          echo "Branch ${branch} exists."
          echo "result=true" >> "${GITHUB_OUTPUT}"
        else
          echo "Branch ${branch} does not exist."
          echo "result=false" >> "${GITHUB_OUTPUT}"
        fi

    # If the matching bump/nightly-YYYY-MM-DD branch already exists there is nothing left
    # to do, so every step from here on is guarded on the check above. (A step that runs
    # `exit 0` would only end that step, not the job.)

    - name: Fetch latest bump branch name
      id: latest_bump_branch
      if: steps.check_branch.outputs.result == 'false'
      run: |
        fail() {
          echo "reason=$1" >> "${GITHUB_OUTPUT}"
          echo "::error::$1"
          exit 1
        }
        if ! refs="$(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/bump/v4.*')"; then
          fail "Listing the bump/v4.* branches failed"
        fi
        bump_branches="$(grep -E '^bump/v4\.[0-9]+\.0$' <<< "${refs}" || true)"
        if [[ -z "${bump_branches}" ]]; then
          fail "Did not find any bump/v4.x.0 branch"
        fi
        sorted="$(sort -V <<< "${bump_branches}")"
        latest="$(tail -n 1 <<< "${sorted}")"
        echo "Latest bump branch: ${latest}"
        echo "result=${latest}" >> "${GITHUB_OUTPUT}"

    - name: Fetch lean-toolchain from latest bump branch
      id: bump_version
      if: steps.check_branch.outputs.result == 'false'
      env:
        BUMP_BRANCH: ${{ steps.latest_bump_branch.outputs.result }}
      run: |
        fail() {
          echo "reason=$1" >> "${GITHUB_OUTPUT}"
          echo "::error::$1"
          exit 1
        }
        echo "branch_name=${BUMP_BRANCH}" >> "${GITHUB_OUTPUT}"
        if ! sha="$(git rev-parse --verify --quiet "origin/${BUMP_BRANCH}^{commit}")"; then
          fail "Could not resolve branch ${BUMP_BRANCH}"
        fi
        echo "branch_sha=${sha}" >> "${GITHUB_OUTPUT}"
        if ! content="$(git show "${sha}:lean-toolchain")"; then
          fail "Could not read lean-toolchain from ${BUMP_BRANCH}"
        fi
        content="${content//[[:space:]]/}"
        if [[ -z "${content}" ]]; then
          echo "toolchain_content=(empty)" >> "${GITHUB_OUTPUT}"
          fail "lean-toolchain on ${BUMP_BRANCH} is empty"
        fi
        echo "toolchain_content=${content}" >> "${GITHUB_OUTPUT}"
        if [[ ! "${content}" =~ leanprover/lean4:nightly-([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
          fail "lean-toolchain on ${BUMP_BRANCH} does not match the expected pattern 'leanprover/lean4:nightly-YYYY-MM-DD'"
        fi
        echo "result=${BASH_REMATCH[1]}" >> "${GITHUB_OUTPUT}"

    # Each of the two steps above can fail for more than one reason, so the warnings below
    # report the reason the script recorded rather than guessing at a single cause.

    - name: Send warning message on Zulip if the latest bump/v4.x.0 branch could not be determined
      if: failure() && steps.latest_bump_branch.outcome == 'failure'
      uses: zulip/github-actions-zulip/send-message@e4c8f27c732ba9bd98ac6be0583096dea82feea5 # v1.0.2
      with:
        api-key: ${{ secrets.ZULIP_API_KEY }}
        email: 'github-mathlib4-bot@leanprover.zulipchat.com'
        organization-url: 'https://leanprover.zulipchat.com'
        to: 'nightly-testing-cslib'
        type: 'stream'
        topic: 'Cslib status updates'
        content: |
          ⚠️ Warning: Could not determine the latest `bump/v4.x.0` branch, so no `bump/nightly-${{ env.NIGHTLY }}` PR was opened.

          **Reason:** ${{ steps.latest_bump_branch.outputs.reason || 'unknown (see the run log)' }}
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Send warning message on Zulip if the bump branch toolchain could not be read
      if: failure() && steps.bump_version.outcome == 'failure'
      uses: zulip/github-actions-zulip/send-message@e4c8f27c732ba9bd98ac6be0583096dea82feea5 # v1.0.2
      with:
        api-key: ${{ secrets.ZULIP_API_KEY }}
        email: 'github-mathlib4-bot@leanprover.zulipchat.com'
        organization-url: 'https://leanprover.zulipchat.com'
        to: 'nightly-testing-cslib'
        type: 'stream'
        topic: 'Cslib status updates'
        content: |
          ⚠️ Warning: Could not read a nightly toolchain from bump branch `${{ steps.bump_version.outputs.branch_name }}`, so no `bump/nightly-${{ env.NIGHTLY }}` PR was opened.

          **Reason:** ${{ steps.bump_version.outputs.reason || 'unknown (see the run log)' }}
          **Branch:** `${{ steps.bump_version.outputs.branch_name }}`
          **File URL:** https://github.com/${{ github.repository }}/blob/${{ steps.bump_version.outputs.branch_sha }}/lean-toolchain
          **Current content:** `${{ steps.bump_version.outputs.toolchain_content }}`
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This needs to be fixed for the nightly testing process to work correctly.

    - name: Setup for automatic PR creation
      if: steps.check_branch.outputs.result == 'false'
      env:
        BUMP_VERSION: ${{ steps.bump_version.outputs.result }}
        BUMP_BRANCH: ${{ steps.latest_bump_branch.outputs.result }}
        SHA: ${{ env.SHA }}
      run: |
        echo "Installing zulip CLI..."
        pip install zulip
        echo "Configuring git identity for mathlib4-bot..."
        git config --global user.name "mathlib4-bot"
        git config --global user.email "github-mathlib4-bot@leanprover.zulipchat.com"
        echo "Setting up zulip credentials..."
        {
          echo "[api]"
          echo "email=github-mathlib4-bot@leanprover.zulipchat.com"
          echo "key=${{ secrets.ZULIP_API_KEY }}"
          echo "site=https://leanprover.zulipchat.com"
        } > ~/.zuliprc
        chmod 600 ~/.zuliprc
        echo "Setup complete"

    - name: Clean workspace and checkout Cslib
      if: steps.check_branch.outputs.result == 'false'
      run: |
        sudo rm -rf -- *
    - name: Checkout Cslib repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      if: steps.check_branch.outputs.result == 'false'
      with:
        ref: nightly-testing # checkout nightly-testing branch (shouldn't matter which)
        fetch-depth: 0 # checkout all branches
        token: ${{ steps.app-token.outputs.token }}

    - name: Attempt automatic PR creation
      id: auto_pr
      if: steps.check_branch.outputs.result == 'false'
      continue-on-error: true
      env:
        BUMP_VERSION: ${{ steps.bump_version.outputs.result }}
        BUMP_BRANCH: ${{ steps.latest_bump_branch.outputs.result }}
        SHA: ${{ env.SHA }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      run: |
        echo "Current version: ${NIGHTLY}"
        echo "Target bump branch: ${BUMP_BRANCH}"
        echo "Using commit SHA: ${SHA}"
        current_version="${NIGHTLY}"
        bump_branch_suffix="${BUMP_BRANCH#bump/}"
        echo "Running create-adaptation-pr.sh with:"
        echo "  bumpversion: ${bump_branch_suffix}"
        echo "  nightlydate: ${current_version}"
        echo "  nightlysha: ${SHA}"
        ./scripts/create-adaptation-pr.sh --bumpversion="${bump_branch_suffix}" --nightlydate="${current_version}" --nightlysha="${SHA}" --auto=yes

    - name: Fallback to manual instructions
      if: steps.auto_pr.outcome == 'failure' && steps.check_branch.outputs.result == 'false'
      env:
        BUMP_VERSION: ${{ steps.bump_version.outputs.result }}
        BUMP_BRANCH: ${{ steps.latest_bump_branch.outputs.result }}
        SHA: ${{ env.SHA }}
        ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
        REPOSITORY: ${{ github.repository }}
        CURRENT_RUN_ID: ${{ github.run_id }}
      shell: python
      run: |
        import os
        import re
        import zulip
        client = zulip.Client(config_file="~/.zuliprc")
        current_version = os.getenv('NIGHTLY')
        bump_version = os.getenv('BUMP_VERSION')
        bump_branch = os.getenv('BUMP_BRANCH')
        sha = os.getenv('SHA')
        repository = os.getenv('REPOSITORY')
        current_run_id = os.getenv('CURRENT_RUN_ID')
        print(f'Current version: {current_version}, Bump version: {bump_version}, SHA: {sha}')
        if current_version > bump_version:
            print('Lean toolchain in `nightly-testing` is ahead of the bump branch.')
            # Get the last message from the bot in the 'Cslib bump branch reminders' topic.
            # We narrow by sender to ignore human replies in between.
            bot_email = 'github-mathlib4-bot@leanprover.zulipchat.com'
            request = {
              'anchor': 'newest',
              'num_before': 1,
              'num_after': 0,
              'narrow': [
                {'operator': 'stream', 'operand': 'nightly-testing-cslib'},
                {'operator': 'topic', 'operand': 'Cslib bump branch reminders'},
                {'operator': 'sender', 'operand': bot_email}
              ],
              'apply_markdown': False    # Otherwise the content test below fails.
            }
            response = client.get_messages(request)
            messages = response['messages']
            last_bot_message = messages[0] if messages else None
            bump_branch_suffix = bump_branch.replace('bump/', '')
            failed_link = f"https://github.com/{repository}/actions/runs/{current_run_id}"
            payload = f"🛠️: Automatic PR creation [failed]({failed_link}). Please create a new bump/nightly-{current_version} branch from nightly-testing (specifically {sha}), and then PR that to {bump_branch}. "
            payload += "To do so semi-automatically, run the following script from Cslib root:\n\n"
            payload += f"```bash\n./scripts/create-adaptation-pr.sh --bumpversion={bump_branch_suffix} --nightlydate={current_version} --nightlysha={sha}\n```\n"
            # Check if we already posted a message for this nightly date and bump branch.
            # We extract these fields from the last bot message rather than comparing substrings,
            # since the message also contains a run ID that differs between workflow runs.
            should_post = True
            if last_bot_message:
                last_content = last_bot_message['content']
                # Extract nightly date and bump branch from last bot message
                date_match = re.search(r'bump/nightly-(\d{4}-\d{2}-\d{2})', last_content)
                branch_match = re.search(r'PR that to (bump/v[\d.]+)', last_content)
                if date_match and branch_match:
                    last_date = date_match.group(1)
                    last_branch = branch_match.group(1)
                    if last_date == current_version and last_branch == bump_branch:
                        should_post = False
                        print(f'Already posted for nightly {current_version} and {bump_branch}')
            if should_post:
                if last_bot_message:
                    print("###### Last bot message:")
                    print(last_bot_message['content'])
                    print("###### Current message:")
                    print(payload)
                # Post the reminder message
                request = {
                    'type': 'stream',
                    'to': 'nightly-testing-cslib',
                    'topic': 'Cslib bump branch reminders',
                    'content': payload
                }
                result = client.send_message(request)
                print(result)
        else:
            print('No action needed.')

    # Catch-all for every other failure in this job: the steps before the branch check
    # (app token, checkout, tag update, Zulip status post) and the steps after the two
    # warnings above. Without this they would fail silently, since the two warnings above
    # only fire for their own step. A skipped step's outcome is 'skipped', so the two
    # comparisons below hold whenever those steps did not run.
    - name: Send warning message on Zulip on any other failure
      if: >-
        (failure() || cancelled())
        && steps.latest_bump_branch.outcome != 'failure'
        && steps.bump_version.outcome != 'failure'
      uses: zulip/github-actions-zulip/send-message@e4c8f27c732ba9bd98ac6be0583096dea82feea5 # v1.0.2
      with:
        api-key: ${{ secrets.ZULIP_API_KEY }}
        email: 'github-mathlib4-bot@leanprover.zulipchat.com'
        organization-url: 'https://leanprover.zulipchat.com'
        to: 'nightly-testing-cslib'
        type: 'stream'
        topic: 'Cslib status updates'
        content: |
          ⚠️ Warning: The job that checks whether a `bump/nightly-YYYY-MM-DD` PR is needed failed or was cancelled at a step that has no dedicated warning, so it may not have reached PR creation.

          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
