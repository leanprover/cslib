name: Lean Action CI

on:
  push:
    branches:
      - main
      - nightly-testing
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Set up cvc5
        run: |
          lake update cvc5
          lake build @cvc5
          cvc5_bin="$(find .lake/packages/cvc5 -maxdepth 5 -type f -name cvc5 -path '*/bin/cvc5' -print -quit)"
          test -n "$cvc5_bin"
          echo "$(dirname "$cvc5_bin")" >> "$GITHUB_PATH"
      - name: Build
        run: lake build
      - name: Test
        run: lake test
      - name: Lint
        run: lake lint
      #- name: "lake shake"
      #  run: |
      #    set -e
      #    lake shake --add-public --keep-implied --keep-prefix Cslib
      - name: "checkInitImports"
        run: |
          set -e
          lake exe checkInitImports
      - uses: leanprover-community/lint-style-action@main
        with:
          mode: check
