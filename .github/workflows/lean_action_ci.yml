name: Lean Action CI

on:
  push:
    branches:
      - main
      - nightly-testing
  pull_request:
  merge_group:
  workflow_dispatch:

# Label each run; only the latest run carrying a given label is kept. Pushes to
# main and nightly-testing get the run id in their label, making it unique, so
# those runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly-testing') && github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail --iofail"
          test-args: "--wfail --iofail"
      - name: "lake exe mk_all --check"
        run: |
          set -e
          lake exe mk_all --check
      #- name: "lake shake"
      #  run: |
      #    set -e
      #    lake shake --add-public --keep-implied --keep-prefix Cslib
      - name: "checkInitImports"
        run: |
          set -e
          lake exe checkInitImports
      - uses: leanprover-community/lint-style-action@e6128ab22cb03b509075ae46c33727e3952ffab7 # 2026-05-12
        with:
          mode: check
