name: Lean Action CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Also fetch the parents of the PR merge commit, to diff against the base branch.
          fetch-depth: 2
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail --iofail"
          test-args: "--wfail --iofail"
      - name: "lake exe mk_all --check"
        run: |
          set -e
          lake exe mk_all --check
      #- name: "lake shake"
      #  run: |
      #    set -e
      #    lake shake --add-public --keep-implied --keep-prefix Cslib
      - name: "checkInitImports"
        run: |
          set -e
          lake exe checkInitImports
      - name: "Weekly linters on changed files"
        id: weekly-lints
        if: github.event_name == 'pull_request'
        # This step only collects suggestions, it must never fail the job. They are reported by
        # the weekly-lints job, so that they do not need a second build.
        continue-on-error: true
        run: |
          set -euo pipefail
          findings="${RUNNER_TEMP}/weekly-lints-findings.jsonl"
          : > "${findings}"
          # HEAD is the merge of the PR into the base branch, so HEAD^1 is the base branch.
          git diff -z --name-only --diff-filter=d HEAD^1 HEAD -- 'Cslib/*.lean' > "${RUNNER_TEMP}/changed-files"
          mapfile -d '' -t files < "${RUNNER_TEMP}/changed-files"
          for file in "${files[@]}"; do
            echo "Checking ${file}"
            # Keep only the messages of the linters in `linter.weeklyLintSet` (see `Mathlib/Init.lean`).
            # Some of these log plain warnings without a linter kind (e.g. `verifyGrindOnly`), so keep
            # all warnings too: the build passed with `--wfail`, so these come from the weekly linters.
            lake lean "${file}" -- --json -Dweak.linter.weeklyLintSet=true |
              jq -cR --arg file "${file}" 'fromjson?
                | select((.kind | IN("linter.tacticAnalysis.mergeWithGrind",
                                     "linter.style.docStringVerso",
                                     "linter.tacticAnalysis.verifyGrindOnly"))
                         or .severity == "warning")
                | {path: $file, line: .pos.line, col: (.pos.column + 1),
                   message: (.data + (if .kind == "[anonymous]" then "" else " (\(.kind))" end))}' \
                >> "${findings}" ||
              jq -nc --arg file "${file}" \
                '{path: $file, message: "Could not run the weekly linters on this file"}' >> "${findings}"
          done
          echo "findings=$(jq -cs . "${findings}")" >> "${GITHUB_OUTPUT}"
    outputs:
      weekly-lints-outcome: ${{ steps.weekly-lints.outcome }}
      weekly-lints-findings: ${{ steps.weekly-lints.outputs.findings }}

  # Optional suggestions from the weekly linters. This job fails when there are any, so that they
  # are visible on the PR, but it is not a required check, so it does not block merging.
  weekly-lints:
    name: "Weekly linter suggestions (optional)"
    needs: ci-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: "Report weekly linter suggestions"
        shell: python
        env:
          OUTCOME: ${{ needs.ci-checks.outputs.weekly-lints-outcome }}
          FINDINGS: ${{ needs.ci-checks.outputs.weekly-lints-findings }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The merge commit that the linters ran on, so the line numbers match.
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
        run: |
          import hashlib
          import json
          import os
          import sys

          if os.environ["OUTCOME"] != "success":
              print(f"::error::The weekly linters step did not succeed ({os.environ['OUTCOME']}), see the ci-checks job")
              sys.exit(1)
          findings = json.loads(os.environ["FINDINGS"])
          if not findings:
              sys.exit(0)


          def escape(message):
              # Workflow commands need `%`, `\r` and `\n` in messages to be escaped.
              return message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          rows = []
          for finding in findings:
              path, line, message = finding["path"], finding.get("line"), finding["message"]
              location = f"{path}:{line}:{finding['col']}" if line else path
              # GitHub anchors files in the diff by the SHA-256 of their path.
              diff_url = f"{os.environ['PR_URL']}/files#diff-{hashlib.sha256(path.encode()).hexdigest()}"
              source_url = f"{os.environ['SOURCE_URL']}/{path}"
              if line:
                  diff_url += f"R{line}"
                  source_url += f"#L{line}"
              print(f"{location}: {message}\n")
              position = f",line={line},col={finding['col']}" if line else ""
              print(f"::warning file={path}{position}::{escape(message)}")
              summary = message.splitlines()[0].replace("|", "\\|")
              rows.append(f"| [`{location}`]({diff_url}) ([source]({source_url})) | {summary} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(
                  "## Weekly linter suggestions\n\n"
                  "These are optional and do not block merging.\n\n"
                  "| Location | Suggestion |\n| --- | --- |\n" + "\n".join(rows) + "\n"
              )
          print(
              f"::error::The weekly linters have {len(findings)} suggestion(s), see the annotations or the job"
              " summary. This check is optional and does not block merging."
          )
          sys.exit(1)
